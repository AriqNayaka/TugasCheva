<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
    <title>Document</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1>Data Mahasiswa</h1>
      <button id="btn-tambah" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tambah">Tambah</button>
      <button id="btn-refresh" class="btn btn-secondary" onclick="location.reload();">Refresh</button>
      <table border="1" class="table table-striped mt-3">
        <thead>
          <td>NO</td>
          <td>NPM</td>
          <td>NAMA</td>
          <td>JURUSAN</td>
          <td>TAHUN MASUK</td>
          <td>KELAS</td>
          <td>AKSI</td>
        </thead>
        <tbody id="mahasiswa-list"></tbody>
      </table>
    </div>
    <div class="modal fade" id="tambah" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Tambah</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div>
              <div class="mb-3">
                <label for="npm" class="col-form-label">NPM:</label>
                <input type="text" class="form-control" id="npm" name="npm" required />
              </div>
              <div class="mb-3">
                <label for="nama" class="col-form-label">Nama:</label>
                <input type="text" class="form-control" id="nama" name="nama" required />
              </div>
              <div class="mb-3">
                <label for="jurusan" class="col-form-label">Jurusan:</label>
                <input type="text" class="form-control" id="jurusan" name="jurusan" required />
              </div>
              <div class="mb-3">
                <label for="tahun_masuk" class="col-form-label">Tahun Masuk:</label>
                <input type="date" class="form-control" id="tahun_masuk" name="tahun_masuk" required />
              </div>
              <div class="mb-3">
                <label for="kelas" class="col-form-label">Kelas:</label>
                <input type="text" class="form-control" id="kelas" name="kelas" required />
              </div>
              <button type="submit" class="btn btn-primary" onclick="addMahasiswa()">Save changes</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="modal-list"></div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</html>
